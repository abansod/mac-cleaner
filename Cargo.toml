[package]
name = "mac-cleaner"
version = "0.0.5"
edition = "2021"
description = "macOS CLI cleaner — junk, clutter, and duplicate file removal"
license = "MIT"
authors = ["Akshay Bansod <abansod@pm.me>"]
repository = "https://github.com/abansod/mac-cleaner"
homepage = "https://github.com/abansod/mac-cleaner"
readme = "README.md"
keywords = ["macos", "cleaner", "disk", "duplicates", "cli"]
categories = ["command-line-utilities"]
rust-version = "1.74"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
libc = "0.2"
ratatui = "0.29"
sha2 = "0.10"
walkdir = "2"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "scan"
harness = false

[profile.release]
lto = true
codegen-units = 1
strip = true

# Release build with symbols, for profilers such as samply.
[profile.profiling]
inherits = "release"
strip = false
debug = true
