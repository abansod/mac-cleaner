name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check version bump rules
        run: ./scripts/version-bump.sh --self-test
      - name: Check release tag rules
        run: ./scripts/create-release-tag.sh --self-test
      - name: Check commit message rules
        run: ./scripts/check-commit-msg.sh --self-test
      - name: Check pull request commit messages
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}"
          base="$(git merge-base HEAD "origin/${{ github.base_ref }}")"
          ./scripts/check-commit-msg.sh --range "${base}..HEAD"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check, test, and smoke
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
          cargo run -- --version
          cargo run -- categories

  # Writes the package version into Cargo.toml and Cargo.lock on the pull request.
  # After merge, the tag job below creates v<version> only when test succeeds.
  version:
    name: Bump version
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: version-bump-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Fetch base branch
        run: git fetch origin "${{ github.base_ref }}"
      - name: Apply Commitizen version bump
        run: ./scripts/version-bump.sh "origin/${{ github.base_ref }}"
      - name: Commit version bump
        run: |
          if git diff --quiet -- Cargo.toml Cargo.lock; then
            echo "Version already matches the Commitizen bump."
            exit 0
          fi
          version="$(awk '/^version = "/ { gsub(/^version = "/, "", $0); gsub(/".*$/, "", $0); print; exit }' Cargo.toml)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "chore(release): bump version to ${version}"
          git push origin "HEAD:${{ github.head_ref }}"

  tag:
    name: Create tag from Cargo.toml
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: tag-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - name: Create release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/create-release-tag.sh
